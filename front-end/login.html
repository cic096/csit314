<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Job Search</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-card">
        <h1>Job Search</h1>
        <p class="subtitle">Sign in to your account</p>
        <form>
            <div id="errorMsg" class="alert alert-error hidden"></div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <label for="role">I am a</label>
                <select id="role">
                    <option value="candidate">Candidate</option>
                    <option value="employer">Employer</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:16px;" id="submit">Sign In</button>
        </form>
        <div class="auth-link">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>
</body>
<script src = "../LoginScript.js" type="module"></script>
<script>
    const submit = document.getElementById('submit');
    submit.addEventListener('click', () => {
        let success = login(document.getElementById("email").value, document.getElementById("password").value, document.getElementById('role').value);
        if (success && document.getElementById('role').value == 'candidate') {
            location.href = 'candidate-home.html';
        }
        else if (success && document.getElementById('role').value == 'employer') {
            location.href = 'employer-home.html';
        }
        else {
            let error = document.getElementById('errorMsg');
            error.classList.remove('hidden');
            error.innerText = 'Login failed.';
        }
    });
</script>
</html>
