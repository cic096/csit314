<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Job Search</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <div class="auth-card">
        <h1>Job Search</h1>
        <p class="subtitle">Join as a candidate or employer</p>
        <form>
            <div id="signupError" class="alert alert-error hidden"></div>

            <div class="role-toggle">
                <button type="button" class="active" data-role="candidate" id="candidate">Candidate</button>
                <button type="button" data-role="employer" id="employer">Employer</button>
            </div>

            <div id="candidateFields">
                <div class="form-group">
                    <label for="candEmail">Email Address</label>
                    <input type="email" id="candEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="preferredName">Preferred Name (optional)</label>
                    <input type="text" id="preferredName" placeholder="How you'd like to be addressed">
                </div>
                <div class="form-group">
                    <label for="education">Highest Education Level</label>
                    <select id="education">
                        <option value="0">Year 10 or earlier</option>
                        <option value="1">Year 12</option>
                        <option value="2">Bachelors Degree</option>
                        <option value="3">Masters Degree</option>
                        <option value="4">PhD</option>
                    </select>
                </div>
                <div class="form-group hidden" id="majorGroup">
                    <label for="major">Major / Field of Study</label>
                    <input type="text" id="major" placeholder="e.g. Computer Science">
                </div>
                <div class="form-group">
                    <label for="experience">Years of Experience</label>
                    <input type="number" id="experience" min="0" value="0" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="candPassword">Password</label>
                        <input type="password" id="candPassword" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="candConfirm">Confirm Password</label>
                        <input type="password" id="candConfirm" placeholder="Confirm your password" required>
                    </div>
                </div>
            </div>

            <div id="employerFields" class="hidden">
                <div class="form-group">
                    <label for="empEmail">Email Address</label>
                    <input type="email" id="empEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" placeholder="Acme Corp" required>
                </div>
                <div class="form-group">
                    <label for="bin">Business Identification Number (BIN)</label>
                    <input type="text" id="bin" placeholder="e.g. 123456789" required>
                </div>
                <div class="form-group">
                    <label for="industry">Industry</label>
                    <input type="text" id="industry" placeholder="e.g. Technology" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="empPassword">Password</label>
                        <input type="password" id="empPassword" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="empConfirm">Confirm Password</label>
                        <input type="password" id="empConfirm" placeholder="Confirm your password" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:16px;" id="submit">Create Account</button>
        </form>
        <div class="auth-link">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>
    <script type="module">
        import { employeeSignUp } from '../dist/bundle.js';
    </script>
</body>
</html>
