<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Job Search</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <div class="auth-card">
        <h1>Job Search</h1>
        <p class="subtitle">Join as a candidate or employer</p>
        <form>
            <div id="signupError" class="alert alert-error hidden"></div>

            <div class="role-toggle">
                <button type="button" class="active" data-role="candidate" id="candidate">Candidate</button>
                <button type="button" data-role="employer" id="employer">Employer</button>
            </div>

            <div id="candidateFields">
                <div class="form-group">
                    <label for="candEmail">Email Address</label>
                    <input type="email" id="candEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="preferredName">Preferred Name (optional)</label>
                    <input type="text" id="preferredName" placeholder="How you'd like to be addressed">
                </div>
                <div class="form-group">
                    <label for="education">Highest Education Level</label>
                    <select id="education">
                        <option value="0">Year 10 or earlier</option>
                        <option value="1">Year 12</option>
                        <option value="2">Bachelors Degree</option>
                        <option value="3">Masters Degree</option>
                        <option value="4">PhD</option>
                    </select>
                </div>
                <div class="form-group hidden" id="majorGroup">
                    <label for="major">Major / Field of Study</label>
                    <input type="text" id="major" placeholder="e.g. Computer Science">
                </div>
                <div class="form-group">
                    <label for="experience">Years of Experience</label>
                    <input type="number" id="experience" min="0" value="0" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="candPassword">Password</label>
                        <input type="password" id="candPassword" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="candConfirm">Confirm Password</label>
                        <input type="password" id="candConfirm" placeholder="Confirm your password" required>
                    </div>
                </div>
            </div>

            <div id="employerFields" class="hidden">
                <div class="form-group">
                    <label for="empEmail">Email Address</label>
                    <input type="email" id="empEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" placeholder="Acme Corp" required>
                </div>
                <div class="form-group">
                    <label for="bin">Business Identification Number (BIN)</label>
                    <input type="text" id="bin" placeholder="e.g. 123456789" required>
                </div>
                <div class="form-group">
                    <label for="industry">Industry</label>
                    <input type="text" id="industry" placeholder="e.g. Technology" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="empPassword">Password</label>
                        <input type="password" id="empPassword" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="empConfirm">Confirm Password</label>
                        <input type="password" id="empConfirm" placeholder="Confirm your password" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:16px;" id="submit">Create Account</button>
        </form>
        <div class="auth-link">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>
    <script type="module">
        import { employeeSignUp } from '../dist/bundle.js';

        let canSign = true;
    const error = document.getElementById("signupError");
    const eduSpinner = document.getElementById("education");
    const major = document.getElementById("majorGroup");
    eduSpinner.addEventListener("change", (event) => {
        if (event.target.value == "2" || event.target.value == "3" || event.target.value == "4") {
            major.classList.remove('hidden');
            major.setAttribute('required');
        }
        else {
            major.classList.add('hidden');
            major.removeAttribute('required')
        }
    });

    const employeeButton = document.getElementById("candidate");
    const employeeGroup = document.getElementById("candidateFields");
    const employerButton = document.getElementById("employer");
    const employerGroup = document.getElementById("employerFields");
    employerButton.addEventListener("click", () => {
        employeeGroup.classList.add('hidden');
        employeeButton.classList.remove('active');
        employerGroup.classList.remove('hidden');
        employerButton.classList.add('active');
        error.innerText = "";
        error.classList.add('hidden');
    });

    employeeButton.addEventListener("click", () => {
        employerGroup.classList.add('hidden');
        employerButton.classList.remove('active');
        employeeGroup.classList.remove('hidden');
        employeeButton.classList.add('active');
        error.innerText = "";
        error.classList.add('hidden');
    });

    const candPassword = document.getElementById("candPassword");
    const candConfirm = document.getElementById("candConfirm");
    candConfirm.addEventListener("input", () => {
        if (candPassword.value != candConfirm.value) {
            error.classList.remove('hidden')
            error.innerText = "Passwords do not match.";
            canSign = false;
        }
        else {
            error.innerText = "";
            error.classList.add('hidden');
            canSign = true;
        }
    });

    const empPassword = document.getElementById("empPassword");
    const empConfirm = document.getElementById("empConfirm");
    empConfirm.addEventListener("input", () => {
        if (empPassword.value != empConfirm.value) {
            error.innerText = "Passwords do not match.";
            error.classList.remove('hidden');
            canSign = false;
        }
        else {
            error.innerText = "";
            error.classList.add('hidden');
            canSign = true;
        }
    });

    const submit = document.getElementById('submit');
    submit.addEventListener("click", () => {
        var succeed;
        if (canSign) {
            if (employeeButton.classList.contains('active')) {
                var succeed = employeeSignUp(document.getElementById('candEmail').value, candPassword.value, document.getElementById('firstName').value, document.getElementById('lastName').value, document.getElementById('preferredName').value,
                eduSpinner.value, major.value, document.getElementById("experience").value);
                console.log(succeed);
                if (succeed) {
                    // proceed
                }
                else {
                    error.innerText = "Email already in use, please try to log in.";
                    error.classList.remove('hidden');
                }
            }
            else {
                var succeed = employerSignUp(document.getElementById('empEmail').value, document.getElementById('bin').value, empPassword.value, document.getElementById('companyName').value, document.getElementById('industry').value);
                if (succeed){
                    // proceed
                }
                else {
                    error.innerText = "BIN already in use, please try to log in.";
                    error.classList.remove('hidden');
                }
            }
        }
    });
    </script>
</body>
</html>
